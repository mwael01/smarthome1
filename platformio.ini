; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Arduino-ESP32 core 2.0.17 for the hub's LEDC and sensor APIs.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; Compatible with both 2 MB and 4 MB ESP32 modules (avoids 2048k < 4096k header mismatch).
board_upload.flash_size = 2MB
board_build.flash_mode = dio
board_build.partitions = minimal.csv
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<main.cpp> +<audio_voice.cpp> +<mic_i2s.cpp> +<voice_data.cpp>
lib_deps =
  madhephaestus/ESP32Servo@^3.2.1
  miguelbalboa/MFRC522@^1.4.12

[cam_s3_board]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3 N16R8 module with 16 MB quad flash and 8 MB octal PSRAM.
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -O2
  -Isrc/cam_common
  -DBOARD_HAS_PSRAM

[env:cam_face_stream_s3_standalone_usb]
extends = cam_s3_serial
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
  ${cam_s3_board.build_flags}
  -DARDUINO_USB_MODE=0

[env:cam_face_stream_s3_standalone_uart]
extends = cam_s3_serial
monitor_speed = 2000000
build_flags =
  ${cam_s3_board.build_flags}
  -DCAMERA_USB_UART

[env:cam_face_stream_s3_uart_led48]
extends = env:cam_face_stream_s3_standalone_uart
build_flags =
  ${env:cam_face_stream_s3_standalone_uart.build_flags}
  -DCAMERA_UART_LIGHT_PIN=48

[cam_s3_serial]
extends = cam_s3_board
build_src_filter = +<cam_usb_stream/main.cpp> +<cam_common/cam_hw.cpp>
lib_deps = adafruit/Adafruit NeoPixel@1.12.5
