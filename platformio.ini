; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Arduino-ESP32 core 2.0.17 (espressif32@6.9.0) matches camera nodes and stable LEDC/ESP-NOW APIs
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<main.cpp> +<audio_voice.cpp> +<mic_i2s.cpp> +<voice_data.cpp>
lib_deps =
  madhephaestus/ESP32Servo@^3.2.1
  miguelbalboa/MFRC522@^1.4.12

[cam_base]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
board_build.f_flash = 80000000L
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -O2
  -Isrc/cam_common
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCAMERA_MODEL_AI_THINKER

[env:cam_face_stream_s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = huge_app.csv
board_build.f_flash = 80000000L
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<cam_face_stream/> +<cam_common/>
build_flags =
  -O2
  -Isrc/cam_common
  -DBOARD_HAS_PSRAM
  -DCAMERA_MODEL_ESP32S3_EYE
