; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Arduino-ESP32 core 2.0.17 (espressif32@6.9.0) matches camera nodes and stable LEDC/ESP-NOW APIs
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<main.cpp> +<audio_voice.cpp> +<mic_i2s.cpp> +<voice_data.cpp>
lib_deps =
  madhephaestus/ESP32Servo@^3.2.1
  miguelbalboa/MFRC522@^1.4.12

[cam_base]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
board_build.f_flash = 80000000L
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -O2
  -Isrc/cam_common
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCAMERA_MODEL_AI_THINKER

[env:cam_face_stream_s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3 N16R8 module with 16 MB quad flash and 8 MB octal PSRAM.
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<cam_face_stream/> +<cam_common/>
build_flags =
  -O2
  -Isrc/cam_common
  -DBOARD_HAS_PSRAM
  -DCAMERA_MODEL_ESP32S3_EYE

[env:cam_face_stream_s3_standalone]
extends = env:cam_face_stream_s3
build_flags =
  ${env:cam_face_stream_s3.build_flags}
  -DCAMERA_STANDALONE

[env:cam_face_stream_s3_standalone_gpio3]
extends = env:cam_face_stream_s3_gpio3
build_flags =
  ${env:cam_face_stream_s3_gpio3.build_flags}
  -DCAMERA_STANDALONE

[env:cam_face_stream_s3_gpio3]
extends = env:cam_face_stream_s3
build_flags =
  ${env:cam_face_stream_s3.build_flags}
  -DCAM_HW_FLASH_LED_PIN=3
